<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CM-ITA | Information Technology Announcement System</title>
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <div class="wrap bar">
        <a class="brand" href="/">
          <span class="logo" id="logo"
            ><img
              src="/logo.png"
              alt=""
              onload="this.parentNode.classList.add('ok')"
              onerror="this.remove()"
            /><b>IT</b></span
          >
          <span class="bt"
            ><strong>CM-ITA</strong
            ><small>Information Technology Announcement System</small></span
          >
        </a>
        <div class="tools" id="tools"></div>
      </div>
    </header>
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="kicker">BSIT Department</p>
          <h1>Stay ahead.<br /><span>Every update, one place.</span></h1>
          <p class="lead">
            Events, class notices and deadlines for the Bachelor of Science in
            Information Technology.
          </p>
          <input
            id="search"
            type="search"
            placeholder="Search announcements…"
            aria-label="Search announcements"
          />
        </div>
        <div id="spot" class="spot"><div class="spot-skel"></div></div>
      </div>
    </section>
    <main class="wrap">
      <div id="form"></div>
      <div class="chips" id="chips"></div>
      <div id="error"></div>
      <div id="list"></div>
    </main>
    <footer class="foot">
      <div class="wrap">© CM-ITA · BSIT Department</div>
    </footer>
    <div id="chat"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
